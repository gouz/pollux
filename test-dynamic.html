<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Pollux — Admin Test</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                background: #111;
                color: #eee;
                padding: 2rem;
                max-width: 640px;
                margin: 0 auto;
            }
            h1 {
                margin-bottom: 0.5rem;
            }
            label {
                display: block;
                margin: 1rem 0 0.25rem;
                color: #888;
                font-size: 0.85rem;
            }
            input {
                width: 100%;
                padding: 0.5rem;
                background: #222;
                border: 1px solid #333;
                color: #eee;
                border-radius: 6px;
                font-family: monospace;
            }
            .questions {
                display: flex;
                gap: 0.5rem;
                margin: 1rem 0;
                flex-wrap: wrap;
            }
            button {
                padding: 0.6rem 1.2rem;
                border: none;
                border-radius: 6px;
                background: #333;
                color: #eee;
                cursor: pointer;
                font-size: 0.9rem;
            }
            button:hover {
                background: #444;
            }
            button.active {
                background: #4ade80;
                color: #000;
            }
            pre {
                background: #1a1a1a;
                padding: 1rem;
                border-radius: 6px;
                overflow-x: auto;
                font-size: 0.85rem;
                margin-top: 1rem;
                border: 1px solid #222;
            }
            .result {
                margin-top: 1rem;
            }
            .bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin: 0.25rem 0;
            }
            .bar-fill {
                height: 20px;
                border-radius: 4px;
                background: #4ade80;
                min-width: 2px;
                transition: width 0.3s;
            }
            .bar-label {
                min-width: 100px;
                font-size: 0.85rem;
            }
            .bar-count {
                font-size: 0.8rem;
                color: #888;
                min-width: 60px;
            }
            .status {
                color: #888;
                font-size: 0.85rem;
                margin-top: 0.5rem;
            }
            iframe {
                width: 100%;
                height: 200px;
                border: 1px solid #333;
                border-radius: 6px;
                margin-top: 1rem;
                background: #000;
            }
        </style>
    </head>
    <body>
        <h1>🧪 Admin Test</h1>
        <p style="color: #888; font-size: 0.9rem">
            Set a UUID, then click a question to broadcast a round.
        </p>

        <label for="uuid">UUID</label>
        <input id="uuid" type="text" placeholder="0194f1e0-..." />

        <div
            class="vote-link"
            style="
                margin: 0.5rem 0;
                font-size: 0.85rem;
                display: flex;
                gap: 0.5rem;
                align-items: center;
            "
        >
            <span style="color: #888">🔗 Vote URL:</span>
            <code id="vote-link" style="color: #4ade80">—</code>
        </div>

        <div class="questions">
            <button data-step="0" data-choices='["Oui","Non"]'>
                Question 1<br /><small>Oui / Non</small>
            </button>
            <button
                data-step="1"
                data-choices='["Facile[#123456]","Difficile[#654321]"]'
            >
                Question 2<br /><small>Facile / Difficile</small>
            </button>
            <button data-step="2" data-choices='["Pas cher","Cher"]'>
                Question 3<br /><small>Pas cher / Cher</small>
            </button>
        </div>

        <div class="status" id="status">Waiting...</div>

        <iframe id="result-frame"></iframe>

        <script>
            const $uuid = document.getElementById("uuid");
            const $status = document.getElementById("status");
            const $frame = document.getElementById("result-frame");

            const sendStep = async (step, choices) => {
                const uuid = $uuid.value.trim();
                if (!uuid) {
                    $status.textContent = "⚠️ Enter a UUID first";
                    return;
                }

                $status.textContent = `⏳ Sending step ${step}...`;
                const res = await fetch(
                    `http://localhost:3000/api/dynamic/${uuid}/step`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ step, choices }),
                    },
                );
                if (!res.ok) {
                    $status.textContent = `❌ Error ${res.status}`;
                    return;
                }

                $status.textContent = `✅ Step ${step} broadcast: ${choices.join(" | ")}`;
                document.getElementById("vote-link").textContent =
                    `http://localhost:3000/dynamic-vote#${uuid}`;
                $frame.src = `http://localhost:3000/dynamic-result?uuid=${uuid}&step=${step}`;
            };

            document.querySelectorAll(".questions button").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const step = parseInt(btn.dataset.step, 10);
                    const choices = JSON.parse(btn.dataset.choices);
                    sendStep(step, choices);
                });
            });

            if (!location.hash) {
                fetch("http://localhost:3000/api/uuid")
                    .then((r) => r.text())
                    .then((uuid) => {
                        $uuid.value = uuid;
                        $status.textContent = "✅ UUID generated";
                    });
            }
        </script>
    </body>
</html>
