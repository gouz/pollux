<!doctype html>
<html lang="en">
    <head>
        <title>Pollux — Raffle Admin</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>"
        />
        <link rel="stylesheet" href="../styles/style.css" />
        <style>
            /* Page-specific: the spinning wheel is an immersive display element,
               kept full-size on purpose. Shared button/panel/chip/link styles
               come from style.css. */
            .admin-form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            .wheel-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
                margin: 1.5rem 0;
            }
            .wheel-wrapper {
                position: relative;
                width: 340px;
                height: 340px;
            }
            .wheel-wrapper canvas {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                box-shadow: var(--neu-dark), var(--neu-light);
            }
            .wheel-pointer {
                position: absolute;
                top: -12px;
                left: 50%;
                transform: translateX(-50%);
                width: 0;
                height: 0;
                border-left: 16px solid transparent;
                border-right: 16px solid transparent;
                border-top: 24px solid #ef4444;
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
                z-index: 2;
            }
            .wheel-spin-btn {
                padding: 1rem 2.5rem;
                font-size: 1.2rem;
                font-weight: 700;
            }
            .wheel-spin-btn.spinning {
                animation: shake 0.5s ease-in-out infinite;
            }
            @keyframes shake {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(2deg); }
                75% { transform: rotate(-2deg); }
            }
            .player-list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                justify-content: center;
                margin: 1rem 0;
                padding: 1rem;
            }
            .winner-display {
                display: none;
                text-align: center;
                padding: 1.5rem;
                background: rgba(74, 222, 128, 0.12);
                margin-top: 1rem;
            }
            .winner-display.show {
                display: block;
            }
            .winner-display h2 {
                font-size: 2rem;
                font-weight: 800;
                color: #4ade80;
                margin: 0;
            }
            .winner-display .sub {
                font-size: 0.9rem;
                color: var(--text-secondary);
            }
            .winner-display .wheel-spin-btn {
                margin-top: 1rem;
            }
            .status-msg {
                text-align: center;
                min-height: 1.5rem;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <header class="hero">
                <h1>🎲 Raffle</h1>
                <p>Create a raffle and share the link</p>
            </header>

            <div class="link-row">
                <a href="#" id="vote-link" class="link-pill" target="_blank">🎲 Registration page</a>
            </div>

            <form class="admin-form panel" id="form">
                <div class="field-row">
                    <label for="uuid">UUID</label>
                    <input id="uuid" type="text" placeholder="0194f1e0-..." required />
                    <button type="button" id="generate-uuid">Generate</button>
                </div>
            </form>

            <div class="status-msg status" id="status">Generate or enter a UUID to start</div>

            <div class="player-list panel panel--inset" id="player-list"></div>

            <div class="wheel-container" id="wheel-section" style="display:none">
                <div class="wheel-wrapper">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheel-canvas" width="680" height="680"></canvas>
                </div>
                <button class="btn-action wheel-spin-btn" id="spin-btn" disabled>🎰 Spin the wheel</button>
            </div>

            <div class="winner-display panel panel--inset" id="winner-display">
                <div class="sub">🏆 Winner</div>
                <h2 id="winner-name"></h2>
                <button class="btn-action wheel-spin-btn" id="relaunch-btn">🔄 Spin again</button>
            </div>
        </main>
    </body>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/raffle-admin.js"></script>
</html>
