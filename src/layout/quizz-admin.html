<!doctype html>
<html lang="en">
    <head>
        <title>Pollux — Quizz Admin</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>"
        />
        <link rel="stylesheet" href="../styles/style.css" />
        <style>
            /* Page-specific layout only — shared button/panel/chip/link/field
               styles live in style.css. */
            .admin-form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 2rem;
            }
            .admin-form input[type="number"] {
                flex: 0 0 80px;
                box-shadow: var(--neu-inset-dark), var(--neu-inset-light);
            }
            .admin-players {
                margin: 1rem 0;
            }
            .admin-players h3 {
                margin: 0 0 0.5rem;
                font-size: 0.95rem;
            }
            .admin-start {
                margin: 1rem 0;
                display: flex;
                gap: 1rem;
                align-items: center;
                flex-wrap: wrap;
            }
            .admin-start input[type="number"] {
                flex: 0 0 80px;
            }
            .admin-history {
                margin-top: 1.5rem;
            }
            .admin-history h3 {
                margin-bottom: 0.5rem;
            }
            .admin-history .entry {
                padding: 0.5rem 1rem;
                background: var(--surface);
                border-radius: var(--radius-sm);
                margin-bottom: 0.3rem;
                font-size: 0.85rem;
                box-shadow: var(--neu-dark), var(--neu-light);
            }
            .admin-history .entry .step-num {
                font-weight: 600;
                color: var(--primary);
            }
            .admin-history .entry .correct-badge {
                display: inline-block;
                padding: 0.1rem 0.4rem;
                border-radius: 4px;
                background: rgba(74, 222, 128, 0.2);
                color: #4ade80;
                font-size: 0.8rem;
                margin-left: 0.3rem;
            }
            .admin-history .entry .started-badge {
                display: inline-block;
                padding: 0.1rem 0.4rem;
                border-radius: 4px;
                background: rgba(96, 165, 250, 0.2);
                color: #60a5fa;
                font-size: 0.8rem;
                margin-left: 0.3rem;
            }
            .admin-podium {
                margin-top: 1.5rem;
                display: flex;
                gap: 1rem;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <header class="hero">
                <h1>🧠 Quizz Admin</h1>
                <p>Create and manage quiz rounds</p>
            </header>

            <div class="link-row">
                <!-- biome-ignore lint:a11y/useValidAnchor: href set dynamically by JS -->
                <a href="#" id="vote-link" class="link-pill" target="_blank">🧠 Vote page</a>
                <!-- biome-ignore lint:a11y/useValidAnchor: href set dynamically by JS -->
                <a href="#" id="result-link" class="link-pill" target="_blank">📊 Results page</a>
            </div>

            <form class="admin-form panel" id="form">
                <div class="field-row">
                    <label for="uuid">UUID</label>
                    <input id="uuid" type="text" placeholder="0194f1e0-..." required />
                    <button type="button" id="generate-uuid">Generate</button>
                </div>
                <div class="field-row">
                    <label for="step">Step</label>
                    <input id="step" type="number" value="0" min="0" required />
                </div>
                <div class="field-row">
                    <label for="question">Question</label>
                    <input id="question" type="text" placeholder="What is the capital of France?" />
                </div>
                <div class="field-row">
                    <label for="timer-input">Timer (s)</label>
                    <input id="timer-input" type="number" value="30" min="5" max="300" />
                </div>
                <div class="field-row">
                    <label for="media">Media URL</label>
                    <input id="media" type="text" placeholder="https://example.com/image.jpg (optional)" />
                    <span class="status">Image, video, or audio URL</span>
                </div>
                <div class="field-row">
                    <label for="choices">Choices</label>
                    <input id="choices" type="text" placeholder="Choice A, Choice B, Choice C" required />
                </div>
                <div class="field-row">
                    <label for="correct">Correct</label>
                    <input id="correct" type="text" placeholder="0, 2" />
                    <span class="status">0-based indices, comma separated</span>
                </div>
                <div class="field-row">
                    <button type="submit" class="btn-action">💾 Save Step</button>
                    <span class="status" id="status">Ready</span>
                </div>
            </form>

            <div class="admin-players panel" id="players-section" style="display:none">
                <h3>👥 Registered Players (<span id="player-count">0</span>)</h3>
                <div id="players-list"></div>
            </div>

            <div class="admin-start panel" id="start-section" style="display:none">
                <label for="start-timer" class="status">▶ Start current step with timer:</label>
                <input id="start-timer" type="number" value="30" min="5" max="300" />
                <button type="button" id="start-btn" class="btn-action danger">▶ Start</button>
                <span id="start-status" class="status"></span>
            </div>

            <div class="admin-history" id="history">
                <h3>Saved Rounds</h3>
                <div id="history-list">
                    <div class="entry" style="color:var(--text-secondary)">No rounds yet</div>
                </div>
            </div>

            <div class="admin-podium">
                <button type="button" id="podium-btn" class="btn-action gold" disabled>🏆 Show Podium</button>
                <span id="podium-status" class="status"></span>
            </div>
        </main>
    </body>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/quizz-admin.js"></script>
</html>
